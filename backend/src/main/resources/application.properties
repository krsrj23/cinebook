# ============================================================
# CineBook backend configuration
# ============================================================

spring.application.name=cinebook-backend

# ------------------------------------------------------------
# MySQL connection
# Create the schema first: CREATE DATABASE cinebook;
# Then replace YOUR_MYSQL_USERNAME / YOUR_MYSQL_PASSWORD below
# with your local MySQL credentials (see README.md).
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinebook?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

cinebook.jwt.secret=${JWT_SECRET}

# ------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update lets Hibernate create/evolve tables from the
# entity classes automatically - fine for a learning project,
# you would use migrations (Flyway/Liquibase) in production.
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# Server
# ------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------
# JWT
# In a real production system this secret would come from an
# environment variable / secrets manager, not a checked-in file.
# It just needs to be long and random for HS256 (>= 256 bits).
cinebook.jwt.expiration-ms=86400000

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.root=INFO
logging.level.com.cinebook=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
